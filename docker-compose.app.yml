# The application stack: Postgres, the .NET API and the Next.js frontend. Unlike the root
# docker-compose.yml -- which only BUILDS the MCP images -- this file is meant to be brought up
# and left running.
#
#   docker compose -f docker-compose.app.yml up -d --build
#
# The suites live in docker-compose.test.yml, against their own throwaway database. Nothing
# here is ever a test target: this stack holds the development data.
name: protocol-project

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: protocol
      POSTGRES_USER: protocol
      POSTGRES_PASSWORD: protocol
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 expects the mount one level up: it stores data in a version-specific
      # subdirectory so that pg_upgrade --link works across a single mount point.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protocol -d protocol"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./backend
    image: protocol-project/api:latest
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=protocol;Username=protocol;Password=protocol
      Frontend__Origin: http://localhost:3000
      ASPNETCORE_ENVIRONMENT: Development
      # Makes POST /training/erase exist at all (ADR-025). Without it the route is never mapped
      # and the answer is a 404 from the router, not a refusal from a check someone could relax.
      # It is here because this is the local stack the loop is iterated against; a published
      # deployment must never set it, and M5 is when this affordance stops being adequate --
      # that milestone starts storing judgements Hevy cannot return and no regeneration reproduces.
      Development__AllowErase: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./frontend
    image: protocol-project/web:latest
    environment:
      # Server-side only: the browser reaches the API through this app's /api proxy.
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  # Declared external so that compose is UNABLE to remove it -- `down -v` skips external
  # volumes. Standard 14 says the development database is never destroyed; this is what makes
  # the tool incapable of it rather than merely forbidden. The volume already exists under this
  # name; a fresh clone creates it once with:
  #
  #   docker volume create protocol-project_pgdata
  #
  # If it is missing, `up` fails loudly instead of silently starting on an empty database --
  # which looks exactly like data loss, because it is indistinguishable from it.
  pgdata:
    external: true
    name: protocol-project_pgdata
